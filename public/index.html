<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntCam 🐜 — Monitoraggio Formicaio</title>
    <meta name="description" content="Dashboard di monitoraggio formicaio con ESP32-CAM">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 32px 20px 24px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.08), rgba(56, 142, 60, 0.04));
            border-bottom: 1px solid rgba(76, 175, 80, 0.15);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: #888;
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #999;
        }

        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stats-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a047;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .filter-group label {
            font-size: 0.78rem;
            color: #aaa;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .filter-group input[type="date"],
        .filter-group input[type="time"] {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e0e0e8;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group input:focus {
            border-color: #43a047;
        }

        /* Fix per icona calendario/orologio in dark mode */
        .filter-group input[type="date"]::-webkit-calendar-picker-indicator,
        .filter-group input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(67, 160, 71, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-danger {
            background: rgba(244, 67, 54, 0.12);
            color: #ef5350;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }

        .btn-danger:hover {
            background: rgba(244, 67, 54, 0.25);
        }

        /* ===== GALLERY ===== */
        .gallery-container {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(76, 175, 80, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card .img-wrapper {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .card .img-wrapper img {
            width: 100%;
            display: block;
            transition: transform 0.3s ease;
        }

        .card .img-wrapper:hover img {
            transform: scale(1.03);
        }

        .card .info {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card .info .meta {
            flex: 1;
            min-width: 0;
        }

        .card .info .date-text {
            font-size: 0.82rem;
            font-weight: 500;
            color: #ccc;
        }

        .card .info .time-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .card .btn-remove {
            padding: 6px 12px;
            background: rgba(244, 67, 54, 0.1);
            color: #ef5350;
            border: 1px solid rgba(244, 67, 54, 0.15);
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .card .btn-remove:hover {
            background: rgba(244, 67, 54, 0.3);
            border-color: rgba(244, 67, 54, 0.4);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            animation: fadeInLb 0.2s ease;
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeInLb {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== CONFIRM DIALOG ===== */
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .confirm-overlay.active {
            display: flex;
        }

        .confirm-dialog {
            background: #1e1e28;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 28px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.2s ease;
        }

        .confirm-dialog h3 {
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .confirm-dialog p {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 20px;
        }

        .confirm-dialog .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #2e7d32;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #c62828;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5rem; }
            .toolbar { flex-direction: column; }
            .gallery {
                grid-template-columns: 1fr;
            }
            .stats-bar { flex-direction: column; gap: 6px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AntCam 🐜</h1>
        <div class="subtitle">Monitoraggio Formicaio — ESP32-CAM</div>
        <div class="stats-bar">
            <span><span class="dot"></span> Auto-aggiornamento attivo</span>
            <span id="photoCount">0 foto</span>
            <span id="filteredCount"></span>
            <span id="dhtStats" style="color: #66bb6a; font-weight: 500;" title="Nessun dato">🌡️ --°C &nbsp;💧 --%</span>
            <span id="laserStats" style="color: #ffb74d; font-weight: 500;" title="Nessun dato">🐜 0 formiche passate</span>
        </div>
    </div>

    <div class="toolbar">
        <div class="filter-group">
            <label>📅 Da:</label>
            <input type="date" id="dateFrom">
            <input type="time" id="timeFrom">
        </div>
        <div class="filter-group">
            <label>📅 A:</label>
            <input type="date" id="dateTo">
            <input type="time" id="timeTo">
        </div>
        <button class="btn btn-primary" onclick="applyFilter()">Filtra</button>
        <button class="btn btn-secondary" onclick="clearFilter()">Reset</button>
        <button class="btn btn-secondary" onclick="fetchPhotos()">↻ Aggiorna</button>
        <button class="btn btn-primary" onclick="openTimelapse()">🎬 Timelapse</button>
    </div>

    <div class="gallery-container">
        <div class="gallery" id="gallery"></div>
        <div id="loadMoreContainer" style="text-align: center; margin-top: 30px; display: none;">
            <button class="btn btn-secondary" onclick="loadMorePhotos()">⬇️ Carica altre foto</button>
        </div>
    </div>

    <!-- Timelapse Modal -->
    <div class="lightbox" id="timelapseModal" style="flex-direction: column; gap: 15px;">
        <div style="background: #1e1e28; padding: 15px; border-radius: 12px; display: flex; gap: 15px; align-items: center; z-index: 1001;">
            <button class="btn btn-primary" id="tlPlayBtn" onclick="toggleTimelapse()">⏸ Pausa</button>
            <input type="range" id="tlSpeed" min="50" max="1000" step="50" value="100" onchange="updateSpeed()">
            <span id="tlSpeedLabel" style="color: white; font-size: 0.8rem;">100ms/foto</span>
            <button class="btn btn-danger" onclick="closeTimelapse()">Chiudi</button>
        </div>
        <img id="tlImg" src="" style="max-height: 75vh; max-width: 90vw; border-radius: 8px;">
        <div id="tlInfo" style="color: white; font-family: monospace; font-size: 0.9rem;"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Foto ingrandita">
    </div>

    <!-- Confirm dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3>🗑️ Eliminare questa foto?</h3>
            <p id="confirmFilename"></p>
            <div class="actions">
                <button class="btn btn-secondary" onclick="closeConfirm()">Annulla</button>
                <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Elimina</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let allPhotos = [];
        let pendingDelete = null;
        let visibleCount = 50;

        // Estrae data/ora dal nome file: photo-DD-MM-YYYY-HH-MM-SS-mmm.jpg
        function parsePhotoDate(filename) {
            const match = filename.match(/photo-(\d{2})-(\d{2})-(\d{4})-(\d{2})-(\d{2})-(\d{2})/);
            if (!match) return null;
            const [, dd, mm, yyyy, hh, min, ss] = match;
            return new Date(`${yyyy}-${mm}-${dd}T${hh}:${min}:${ss}`);
        }

        function formatDate(date) {
            if (!date) return '—';
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function formatTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        async function fetchPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();
                allPhotos = data.photos || [];
                
                // Formatta il peso in MB
                const sizeMB = (data.totalSizeBytes / (1024 * 1024)).toFixed(2);
                document.getElementById('photoCount').textContent = `${allPhotos.length} foto totali (${sizeMB} MB)`;
                
                renderGallery(getFilteredPhotos());
            } catch (error) {
                console.error("Errore nel caricamento delle foto", error);
                showToast('Errore nel caricamento', true);
            }
        }

        function getFilteredPhotos() {
            const dateFrom = document.getElementById('dateFrom').value;
            const timeFrom = document.getElementById('timeFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const timeTo = document.getElementById('timeTo').value;

            if (!dateFrom && !dateTo && !timeFrom && !timeTo) {
                document.getElementById('filteredCount').textContent = '';
                return allPhotos;
            }

            const from = dateFrom
                ? new Date(`${dateFrom}T${timeFrom || '00:00:00'}`)
                : null;
            const to = dateTo
                ? new Date(`${dateTo}T${timeTo || '23:59:59'}`)
                : null;

            const filtered = allPhotos.filter(photo => {
                const d = parsePhotoDate(photo);
                if (!d) return false;
                if (from && d < from) return false;
                if (to && d > to) return false;
                return true;
            });

            document.getElementById('filteredCount').textContent = `(${filtered.length} filtrate)`;
            return filtered;
        }

        function applyFilter() {
            renderGallery(getFilteredPhotos());
        }

        function clearFilter() {
            document.getElementById('dateFrom').value = '';
            document.getElementById('timeFrom').value = '';
            document.getElementById('dateTo').value = '';
            document.getElementById('timeTo').value = '';
            document.getElementById('filteredCount').textContent = '';
            visibleCount = 50;
            renderGallery(allPhotos);
        }

        function renderGallery(photos) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (photos.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="icon">📷</div>
                        <p>Nessuna foto trovata</p>
                    </div>
                `;
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }

            const toRender = photos.slice(0, visibleCount);

            toRender.forEach((photo, i) => {
                const date = parsePhotoDate(photo);
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(i % 50) * 0.05}s`;
                card.innerHTML = `
                    <div class="img-wrapper" onclick="openLightbox('/uploads/${photo}')">
                        <img src="/uploads/${photo}" loading="lazy" alt="Foto formicaio">
                    </div>
                    <div class="info">
                        <div class="meta">
                            <div class="date-text">📅 ${formatDate(date)}</div>
                            <div class="time-text">🕐 ${formatTime(date)}</div>
                        </div>
                        <button class="btn-remove" onclick="askDelete('${photo}')">🗑️</button>
                    </div>
                `;
                gallery.appendChild(card);
            });

            if (photos.length > visibleCount) {
                document.getElementById('loadMoreContainer').style.display = 'block';
            } else {
                document.getElementById('loadMoreContainer').style.display = 'none';
            }
        }

        function loadMorePhotos() {
            visibleCount += 50;
            renderGallery(getFilteredPhotos());
        }

        // === Lightbox ===
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // === Delete ===
        function askDelete(filename) {
            pendingDelete = filename;
            const date = parsePhotoDate(filename);
            document.getElementById('confirmFilename').textContent =
                date ? `${formatDate(date)} alle ${formatTime(date)}` : filename;
            document.getElementById('confirmOverlay').classList.add('active');
        }

        function closeConfirm() {
            pendingDelete = null;
            document.getElementById('confirmOverlay').classList.remove('active');
        }

        async function confirmDelete() {
            if (!pendingDelete) return;

            const filename = pendingDelete;
            closeConfirm();

            try {
                const res = await fetch(`/api/photos/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    showToast('Foto eliminata');
                    fetchPhotos();
                } else {
                    const msg = await res.text();
                    showToast(`Errore: ${msg}`, true);
                }
            } catch (err) {
                showToast('Errore di rete', true);
            }
        }

        // === Toast ===
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // === Keyboard ===
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeConfirm();
            }
        });

        // === Meteo DHT11 ===
        async function fetchDHT() {
            try {
                const response = await fetch('/api/dht/latest');
                const data = await response.json();
                if (data.temperature !== null) {
                    const timeOnly = data.timestamp ? data.timestamp.split(' ')[1].split('.')[0] : '--:--';
                    document.getElementById('dhtStats').innerHTML = `🌡️ ${data.temperature}°C &nbsp;💧 ${data.humidity}% <span style="font-size:0.75rem; color:#888;">(Agg. ${timeOnly})</span>`;
                    document.getElementById('dhtStats').title = "Ultimo aggiornamento: " + data.timestamp;
                }
            } catch (error) {
                console.error("Errore meteo", error);
            }
        }

        // === Laser e Formiche ===
        async function fetchLaser() {
            try {
                const response = await fetch('/api/laser/latest');
                const data = await response.json();
                if (data.antCount !== undefined) {
                    const timeOnly = data.timestamp ? data.timestamp.split(' ')[1].split('.')[0] : '--:--';
                    document.getElementById('laserStats').innerHTML = `🐜 ${data.antCount} formiche passate <span style="font-size:0.75rem; color:#888;">(Agg. ${timeOnly})</span>`;
                    document.getElementById('laserStats').title = "Ultimo movimento: " + (data.timestamp || "Mai");
                }
            } catch (error) {
                console.error("Errore laser", error);
            }
        }

        // === Timelapse ===
        let tlInterval = null;
        let tlIndex = 0;
        let tlPhotos = [];
        let tlSpeedMs = 100;
        let tlPlaying = false;
        let tlImageObj = new Image(); // Usato per precaricare i frame

        function openTimelapse() {
            tlPhotos = getFilteredPhotos().slice().reverse(); // Ordine cronologico per il video
            if (tlPhotos.length === 0) return showToast('Nessuna foto filtrata per il timelapse!', true);
            
            tlIndex = 0;
            tlSpeedMs = document.getElementById('tlSpeed').value;
            document.getElementById('timelapseModal').classList.add('active');
            tlPlaying = true;
            document.getElementById('tlPlayBtn').textContent = '⏸ Pausa';
            playNextFrame();
        }

        function playNextFrame() {
            if (!tlPlaying) return;
            if (tlIndex >= tlPhotos.length) {
                tlIndex = 0; // Loop infinito
            }
            
            const photo = tlPhotos[tlIndex];
            const startTime = Date.now();
            
            tlImageObj.onload = () => {
                if (!tlPlaying) return; // Interrotto mentre caricava
                
                // Disegna l'immagine solo quando è completamente scaricata
                document.getElementById('tlImg').src = tlImageObj.src;
                
                const d = parsePhotoDate(photo);
                document.getElementById('tlInfo').textContent = `Foto ${tlIndex + 1} di ${tlPhotos.length} - ${formatDate(d)} ${formatTime(d)}`;
                
                tlIndex++;
                
                // Mantiene il ritmo sottraendo il tempo di download
                const elapsed = Date.now() - startTime;
                const remainingTime = Math.max(0, tlSpeedMs - elapsed);
                
                tlInterval = setTimeout(playNextFrame, remainingTime);
            };

            tlImageObj.onerror = () => {
                if (!tlPlaying) return;
                tlIndex++; // Salta la foto se corrotta
                tlInterval = setTimeout(playNextFrame, tlSpeedMs);
            };

            tlImageObj.src = `/uploads/${photo}`;
        }

        function toggleTimelapse() {
            tlPlaying = !tlPlaying;
            document.getElementById('tlPlayBtn').textContent = tlPlaying ? '⏸ Pausa' : '▶️ Play';
            if (tlPlaying) playNextFrame();
            else clearTimeout(tlInterval);
        }

        function updateSpeed() {
            tlSpeedMs = document.getElementById('tlSpeed').value;
            document.getElementById('tlSpeedLabel').textContent = `${tlSpeedMs}ms/foto`;
        }

        function closeTimelapse() {
            tlPlaying = false;
            clearTimeout(tlInterval);
            document.getElementById('timelapseModal').classList.remove('active');
        }

        // === Init ===
        fetchPhotos();
        fetchDHT();
        fetchLaser();
        setInterval(fetchPhotos, 10000);
        setInterval(fetchDHT, 10000);
        setInterval(fetchLaser, 2000); // Il laser si aggiorna più velocemente
    </script>
</body>
</html>
